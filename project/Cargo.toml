[package]
name = "project"
version = "0.1.0"
edition = "2024"

[lib]
name = "project"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
criterion = { version = "0.7.0" }
rand = { version = "0.9.2" }

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "hot_type"
harness = false

[[bench]]
name = "burst_pattern"
harness = false

[[bench]]
name = "imbalanced_processing"
harness = false

[[bench]]
name = "ordering_stress"
harness = false

[[bench]]
name = "strategy_bottleneck"
harness = false
